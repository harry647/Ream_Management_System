# docker-compose.yml
version: '3.9'

services:
  ream-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ream-management-prod
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"  # Only if you expose a web server
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os._exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s